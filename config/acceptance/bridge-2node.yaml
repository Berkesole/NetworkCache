# Bridge-oriented 2-node acceptance topology.
# Each node carries an explicit host and port so TCP endpoint selection
# can come from topology/config without relying on legacy localhost defaults.
nodes:
- id: 1
  host: 172.30.10.11
  port: 41001
  neighbors: [2]

- id: 2
  host: 172.30.10.12
  port: 41002
  neighbors: [1]
