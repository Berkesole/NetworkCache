# Content discovery sanity scenario: Node 1 discovers data seeded at Node 3.
protocol:
  max_hop_count: 4

nodes:
  - id: 1
    host: 172.31.10.11
    port: 43101
    neighbors: [2]
  - id: 2
    host: 172.31.10.12
    port: 43102
    neighbors: [1, 3]
  - id: 3
    host: 172.31.10.13
    port: 43103
    neighbors: [2]

scenario:
  ticks: 120
  data:
    - 3:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a@5
