# Supervisord 配置文件 - 管理 Redis + Rsync 应用进程
# Supervisord configuration for managing Redis + Rsync application process

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
priority=10
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:rsync-app]
# Select the in-process demo or TCP node through RSYNC_APP_TARGET.
command=/bin/bash -lc 'exec /app/build/${RSYNC_APP_TARGET:-rsync-router}'
priority=20
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
