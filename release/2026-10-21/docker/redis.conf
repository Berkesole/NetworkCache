# Redis 配置文件 - 用于单容器多进程部署
# Redis configuration for single-container multi-process deployment

# 关闭 TCP 端口（仅使用 Unix socket）
# Disable TCP port (Unix socket only)
port 0

# 启用 Unix domain socket
# Enable Unix domain socket
unixsocket /run/redis/redis.sock
unixsocketperm 770

# 基本配置
# Basic configuration
bind 127.0.0.1
protected-mode yes
supervised no
daemonize no

# 日志配置
# Logging configuration
loglevel notice
logfile ""

# 内存管理
# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化配置 - AOF 模式
# Persistence configuration - AOF mode
dir /data/redis
dbfilename dump.rdb

# AOF 持久化
# AOF persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 快照（作为备份）
# RDB snapshot (as backup)
save 900 1
save 300 10
save 60 10000

# 性能优化
# Performance optimization
tcp-backlog 511
timeout 0
tcp-keepalive 300
