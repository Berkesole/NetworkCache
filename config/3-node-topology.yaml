# 3 节点拓扑配置示例
# 3-Node Topology Configuration Example
#
# 拓扑结构:
#   Node 1 <---> Node 2 <---> Node 3
#
# 使用方法:
#   auto mock_net = std::make_unique<MockNetwork>(1);
#   mock_net->configure_topology("config/3-node-topology.yaml", 1);

protocol:
  max_hop_count: 4

nodes:
- id: 1
  neighbors: [2]

- id: 2
  neighbors: [1, 3]

- id: 3
  neighbors: [2]

scenario:
  ticks: 10
  data:
    - 3:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a
