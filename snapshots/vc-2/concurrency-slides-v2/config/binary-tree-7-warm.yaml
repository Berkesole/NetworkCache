# 7-node binary tree, warm-up scenario
# 实验目的：在无环拓扑上隔离 warm cache 的传播效果，避开 ring 上 "everyone gets warm" 的退化
#
#         Node 1
#        /      \
#     Node 2   Node 3
#     /    \   /    \
#   N4    N5  N6    N7
#
# Phase 1 (tick=0): N4 请求 key_a (持有方 N7)
#   预期 DATA 路径：N7 → N3 → N1 → N2 → N4
#   warm 节点：{N1, N2, N3, N4, N7}
#   冷节点：{N5, N6}
#
# Phase 2 (tick=8): N5 请求 key_a
#   预期：N5 broadcast 给唯一邻居 N2 → N2 cache hit → 1 跳满足
#   同时根据 §2.2，REQUEST 仍会被 N2 forward 一份给 N1（broadcast-minus-prev-hop）
#   → N1 也 cache hit → 继续 forward 给 N3 → N3 cache hit → ...
#   所以 phase 2 应展示：(a) requester 1-hop 满足；(b) BF-限制下 REQUEST 仍漫延但被 cache 反复短路
#
# diameter = 4（leaf-to-leaf 跨 root）；TTL=6 留 detour buffer

protocol:
  max_hop_count: 6

nodes:
- id: 1
  neighbors: [2, 3]

- id: 2
  neighbors: [1, 4, 5]

- id: 3
  neighbors: [1, 6, 7]

- id: 4
  neighbors: [2]

- id: 5
  neighbors: [2]

- id: 6
  neighbors: [3]

- id: 7
  neighbors: [3]

scenario:
  ticks: 16
  data:
    - 7:redis_key_a=VALUE_OF_A
  requests:
    - 4:redis_key_a@0
    - 5:redis_key_a@8
