# 5-node ring (odd cycle)
# 5 节点单环：奇环，不可二着色
#
#   Node 1 --- Node 2
#     |          |
#   Node 5      Node 3
#     |          |
#     +-- Node 4-+
#
# 验证目标：
#   - 长环 (>4) 下 prev-hop exclusion 不足，必须靠 TTL 终止
#   - 期望日志能看到 hop_count 累加到 max_hop_count 后的 drop
# diameter = 2；TTL=6 让 REQUEST 在环上多绕一圈再被 TTL 截断

protocol:
  max_hop_count: 6

nodes:
- id: 1
  neighbors: [2, 5]

- id: 2
  neighbors: [1, 3]

- id: 3
  neighbors: [2, 4]

- id: 4
  neighbors: [3, 5]

- id: 5
  neighbors: [1, 4]

scenario:
  ticks: 15
  data:
    - 3:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a
