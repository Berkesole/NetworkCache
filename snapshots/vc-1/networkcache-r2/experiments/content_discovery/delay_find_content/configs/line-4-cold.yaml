# Four-node line topology, aligned with the existing bridge-4node acceptance shape.
protocol:
  max_hop_count: 5

nodes:
  - id: 1
    host: 172.31.20.11
    port: 43201
    neighbors: [2]
  - id: 2
    host: 172.31.20.12
    port: 43202
    neighbors: [1, 3]
  - id: 3
    host: 172.31.20.13
    port: 43203
    neighbors: [2, 4]
  - id: 4
    host: 172.31.20.14
    port: 43204
    neighbors: [3]

scenario:
  ticks: 140
  data:
    - 4:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a@5
