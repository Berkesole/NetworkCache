# Minimal 3-node Kathara scenario source for rsync-node-dev.
# The runtime should derive max_hop_count, seed data, and scheduled requests
# from this file when env/CLI overrides are not provided.

protocol:
  max_hop_count: 4

nodes:
- id: 1
  host: 172.30.30.11
  port: 43001
  neighbors: [2]

- id: 2
  host: 172.30.30.12
  port: 43002
  neighbors: [1, 3]

- id: 3
  host: 172.30.30.13
  port: 43003
  neighbors: [2]

scenario:
  ticks: 60
  data:
    - 3:demo_key=DEMO_VALUE_3NODE
  requests:
    - 1:demo_key@20
