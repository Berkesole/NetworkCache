# Kua-inspired 32-device datacenter topology.
#
# Model:
#   - Hosts 1-24 are storage/client-capable protocol nodes.
#   - Rack forwarders 25-28 and core forwarders 29-32 also run rsync-node-dev.
#   - Fabric nodes do not start with data or requests, but they forward and cache
#     DATA on the return path, analogous to NDN router caches in Kua.
#
# Shape:
#   Rack 1: N1-N6    -> N25
#   Rack 2: N7-N12   -> N26
#   Rack 3: N13-N18  -> N27
#   Rack 4: N19-N24  -> N28
#   Core:   N29, N30, N31, N32
#
# Each rack forwarder connects to every core forwarder.
# Edge count = 24 host-rack + 16 rack-core = 40.
# Cross-rack host-to-provider shortest path = 4 hops.

protocol:
  max_hop_count: 8

nodes:
- id: 1
  neighbors: [25]
- id: 2
  neighbors: [25]
- id: 3
  neighbors: [25]
- id: 4
  neighbors: [25]
- id: 5
  neighbors: [25]
- id: 6
  neighbors: [25]

- id: 7
  neighbors: [26]
- id: 8
  neighbors: [26]
- id: 9
  neighbors: [26]
- id: 10
  neighbors: [26]
- id: 11
  neighbors: [26]
- id: 12
  neighbors: [26]

- id: 13
  neighbors: [27]
- id: 14
  neighbors: [27]
- id: 15
  neighbors: [27]
- id: 16
  neighbors: [27]
- id: 17
  neighbors: [27]
- id: 18
  neighbors: [27]

- id: 19
  neighbors: [28]
- id: 20
  neighbors: [28]
- id: 21
  neighbors: [28]
- id: 22
  neighbors: [28]
- id: 23
  neighbors: [28]
- id: 24
  neighbors: [28]

- id: 25
  neighbors: [1, 2, 3, 4, 5, 6, 29, 30, 31, 32]
- id: 26
  neighbors: [7, 8, 9, 10, 11, 12, 29, 30, 31, 32]
- id: 27
  neighbors: [13, 14, 15, 16, 17, 18, 29, 30, 31, 32]
- id: 28
  neighbors: [19, 20, 21, 22, 23, 24, 29, 30, 31, 32]

- id: 29
  neighbors: [25, 26, 27, 28]
- id: 30
  neighbors: [25, 26, 27, 28]
- id: 31
  neighbors: [25, 26, 27, 28]
- id: 32
  neighbors: [25, 26, 27, 28]

scenario:
  ticks: 800
  data:
    - 24:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a@40
    - 2:redis_key_a@600
