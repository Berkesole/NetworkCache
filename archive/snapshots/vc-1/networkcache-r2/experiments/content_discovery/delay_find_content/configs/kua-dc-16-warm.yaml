# Docker mirror of the Kua-inspired 16-device datacenter topology.
# Kathara is the paper-primary environment; this bridge config keeps the same
# protocol graph for pipeline comparison without explicit per-link delay.
protocol:
  max_hop_count: 8

nodes:
  - id: 1
    host: 172.31.50.11
    port: 43501
    neighbors: [10]
  - id: 2
    host: 172.31.50.12
    port: 43502
    neighbors: [10]
  - id: 3
    host: 172.31.50.13
    port: 43503
    neighbors: [10]

  - id: 4
    host: 172.31.50.14
    port: 43504
    neighbors: [11]
  - id: 5
    host: 172.31.50.15
    port: 43505
    neighbors: [11]
  - id: 6
    host: 172.31.50.16
    port: 43506
    neighbors: [11]

  - id: 7
    host: 172.31.50.17
    port: 43507
    neighbors: [12]
  - id: 8
    host: 172.31.50.18
    port: 43508
    neighbors: [12]
  - id: 9
    host: 172.31.50.19
    port: 43509
    neighbors: [12]

  - id: 10
    host: 172.31.50.20
    port: 43510
    neighbors: [1, 2, 3, 13, 14, 15, 16]
  - id: 11
    host: 172.31.50.21
    port: 43511
    neighbors: [4, 5, 6, 13, 14, 15, 16]
  - id: 12
    host: 172.31.50.22
    port: 43512
    neighbors: [7, 8, 9, 13, 14, 15, 16]

  - id: 13
    host: 172.31.50.23
    port: 43513
    neighbors: [10, 11, 12]
  - id: 14
    host: 172.31.50.24
    port: 43514
    neighbors: [10, 11, 12]
  - id: 15
    host: 172.31.50.25
    port: 43515
    neighbors: [10, 11, 12]
  - id: 16
    host: 172.31.50.26
    port: 43516
    neighbors: [10, 11, 12]

scenario:
  ticks: 800
  data:
    - 9:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a@40
    - 2:redis_key_a@600
