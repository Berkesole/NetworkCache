# Five-node line topology for hop-distance sweeps.
protocol:
  max_hop_count: 6

nodes:
  - id: 1
    host: 172.31.30.11
    port: 43301
    neighbors: [2]
  - id: 2
    host: 172.31.30.12
    port: 43302
    neighbors: [1, 3]
  - id: 3
    host: 172.31.30.13
    port: 43303
    neighbors: [2, 4]
  - id: 4
    host: 172.31.30.14
    port: 43304
    neighbors: [3, 5]
  - id: 5
    host: 172.31.30.15
    port: 43305
    neighbors: [4]

scenario:
  ticks: 160
  data:
    - 5:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a@5
