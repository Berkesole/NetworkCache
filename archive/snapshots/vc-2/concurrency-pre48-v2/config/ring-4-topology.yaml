# 4-node ring (C4) topology
# 4 节点环
#
#   Node 1 --- Node 2
#     |          |
#   Node 4 --- Node 3
#
# 验证目标：
#   - 多路径 same-batch union：把 data 放在 N3，从 N1 发 REQUEST，N3 在同一 batch 收到来自 N2 / N4 的两条
#   - DATA 反向多路径：cache dedup 应吸收第二份
# 注：C4 与 "diamond" 等图（仅标号不同），同一拓扑可换 scenario 测不同行为
# diameter = 2；TTL=6 给环上多绕几圈的余地，便于观察 TTL 是否被触发

protocol:
  max_hop_count: 6

nodes:
- id: 1
  neighbors: [2, 4]

- id: 2
  neighbors: [1, 3]

- id: 3
  neighbors: [2, 4]

- id: 4
  neighbors: [1, 3]

scenario:
  ticks: 15
  data:
    - 3:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a
