# Supervisord 配置文件 - 管理 Redis + Rsync 应用进程
# Supervisord configuration for managing Redis + Rsync application process

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
priority=10
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:rsync-app]
# Default remains rsync-router for phase-1; rsync-node-dev is compiled into the image
# but is still an engineering skeleton rather than the container's steady-state runtime.
command=/bin/bash -lc 'exec /app/docker/run-rsync-app.sh'
priority=20
autostart=true
autorestart=unexpected
startretries=10
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
