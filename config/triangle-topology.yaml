# Triangle (3-node ring) topology
# 三角环：最小有环拓扑
#
#   Node 1 --- Node 2
#       \     /
#        Node 3
#
# 验证目标：
#   - REQUEST 不应在三角形里无限绕：靠 prev-hop exclusion + TTL
#   - 单 batch 内 union 仍应正确（is_aggregated=true 的包不再被 union）
# diameter = 1 (任意两点直接相连)；TTL=4 留足 detour buffer

protocol:
  max_hop_count: 4

nodes:
- id: 1
  neighbors: [2, 3]

- id: 2
  neighbors: [1, 3]

- id: 3
  neighbors: [1, 2]

scenario:
  ticks: 10
  data:
    - 3:redis_key_a=VALUE_OF_A
  requests:
    - 1:redis_key_a
